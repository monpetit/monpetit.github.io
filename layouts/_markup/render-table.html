<table {{- range $k, $v := .Attributes }}
  {{- if and $v (ne $k "caption") }}
    {{- printf " %s=%q" $k $v | safeHTMLAttr }}
  {{- end }}
{{- end }}>
  {{- with .Attributes.caption }}
    <!-- caption-side: bottom 스타일을 추가하여 아래로 배치 -->
    <caption style="caption-side: bottom; padding-top: 8px;">{{ . | $.Page.RenderString }}</caption>
  {{- end }}
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th {{- with .Alignment }} {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }} {{- end -}} >
        {{- .Text -}}
      </th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td {{- with .Alignment }} {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }} {{- end -}} >
        {{- .Text -}}
      </td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
